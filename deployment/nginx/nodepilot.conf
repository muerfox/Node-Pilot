# Example reverse proxy for NodePilot. Terminates TLS, forwards HTTP to
# the ASGI process, and upgrades /ws/ connections to WebSockets -- the
# job-progress/console/event streams (section 36) all depend on this
# upgrade being passed through correctly.

upstream nodepilot_controller {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name nodepilot.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nodepilot.example.com;

    ssl_certificate     /etc/letsencrypt/live/nodepilot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nodepilot.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8G;  # large ISO/QCOW2 uploads are chunked, but keep this generous

    location /static/ {
        alias /opt/nodepilot/backend/staticfiles/;
    }

    location /ws/ {
        proxy_pass http://nodepilot_controller;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;  # long-lived console/job/event sockets
    }

    location / {
        proxy_pass http://nodepilot_controller;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
